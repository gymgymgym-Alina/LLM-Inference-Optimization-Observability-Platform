services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=Qwen/Qwen2.5-1.5B-Instruct
    # HF model cache persists across container restarts so the ~3GB
    # download only happens once per host.
    volumes:
      - hf-cache:/root/.cache/huggingface

volumes:
  hf-cache:
